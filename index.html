<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <title>Frontend Mentor | Typing Speed Test</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
	<header>
		<img class="logo" src="./assets/images/logo-small.svg" alt="" aria-hidden="true">
		<span class="best-score">
			<img src="./assets/images/icon-personal-best.svg" alt="" aria-hidden="true">
			Best: <span class="best-score-value" id="best-score">0 WPM</span>
		</span>
	</header>
	<main>
		<div class="top">
			<div class="stats">
				<div class="stat">
					<span class="stat-title">WPM:</span>
					<span id="wpm-stat" class="stat-value white-stat">0</span>
				</div>
				<div class="vertical-line"></div>
				<div class="stat">
					<span class="stat-title">Accuracy:</span>
					<span id="accuracy-stat" class="stat-value red-stat">0%</span>
				</div>
				<div class="vertical-line"></div>
				<div class="stat">
					<span class="stat-title">Time:</span>
					<span id="time-stat" class="stat-value yellow-stat">0:00</span>
				</div>
			</div>
			<div class="settings">
				<div class="level setting">
					<button type="button" class="setting-btn level" id="level-btn">
						<span id="level-value"> Easy</span>
						<img class="arrow" src="./assets/images/icon-down-arrow.svg" alt="" id="level-arrow">
					</button>
					<div class="dropdown" id="level-dropdown">
						<label class="setting-choice" for="easy-level"><input type="radio" name="level" value="easy" id="easy-level">Easy</label>
						<label class="setting-choice" for="medium-level"><input type="radio" name="level" value="medium" id="medium-level">Medium</label>
						<label class="setting-choice" for="hard-level"><input type="radio" name="level" value="hard" id="hard-level">Hard</label>
					</div>
				</div>
				<div class="mode setting">
					<button type="button" class="setting-btn mode"  id="mode-btn">
						<span id="mode-value">Timed (60s)</span>
						<img  class="arrow" id="mode-arrow" src="./assets/images/icon-down-arrow.svg" alt="">
					</button>
					<div class="dropdown" id="mode-dropdown">
						<label class="setting-choice" for="mode-timed"><input type="radio" name="mode" id="mode-timed" value="Timed (60s)">Timed (60s)</label>
						<label class="setting-choice" for="mode-passage"><input type="radio" name="mode" id="mode-passage" value="Passage">Passage</label>
					</div>
				</div>
			</div>
		</div>
		<div class="bottom" id="typing-container">
			<div class="start-typing-container" id="start-typing-container">
				<button type="button" class="start-typing-btn">Start Typing Test</button>
				<p>Or click the text and start typing</p>
			</div>
			<p class="text-container" id="text-container">Lorem ipsum dolor sit amet, consectetur adipisicing elit. Ex pariatur atque accusamus dolor ab esse provident non harum? Pariatur culpa corporis maxime sequi ipsa quos aliquid at ea consectetur ad.</p>
		</div>
	</main>
	<footer>
		<button type="button" id="restart-button" class="action-button">
			Restart Test
			<img class="restart-img" src="./assets/images/icon-restart.svg" alt="">
		</button>
	</footer>
	<script src="app.js"></script>
</body>
</html>
